name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Flutter app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
        working-directory: app
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Import boundary
        run: dart run tool/check_inferno_imports.dart
      - name: Analyze
        run: flutter analyze
        working-directory: app
      - name: Test
        run: flutter test
        working-directory: app

  inferno:
    name: Inferno package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
        working-directory: app
      - name: Analyze
        run: dart analyze
        working-directory: packages/inferno
      - name: Mock and probe suites (builds llama.cpp CPU via build hooks)
        run: dart test
        working-directory: packages/inferno
      - name: Fetch toy GGUF fixtures
        run: |
          echo "INFERNO_TOY_GGUF=$(dart run tool/fetch_toy_model.dart | tail -1)" >> "$GITHUB_ENV"
        working-directory: packages/inferno
      - name: Native lifecycle, cancellation, and failure suites
        run: dart test
        working-directory: packages/inferno
